# ServiceNow MCP Tool Packages Configuration
#
# Packages:
#   none               — Disabled profile for intentionally turning tools off.
#   core               — Minimal read-only essentials.
#   standard           — Broad read-only surface. Default.
#   service_desk       — standard + operational incident/change writes.
#   portal_developer   — standard + portal/changeset/script/local-sync writes.
#   platform_developer — standard + workflow/incident/change/script writes.
#   itsm_developer     — Standalone ITSM: records, approvals, catalog/policy config, shipping.
#   asset_manager      — Materials, asset and ITOM work: queries plus manage_asset.
#   scripting          — Add-on: server-side logic, update sets, XML deployment.
#   office_files       — Add-on: Excel and attachments.
#   debug_window       — Add-on: the shared browser.
#   source_sync        — Add-on: download/diff/push of server-side sources.
#   portal_design      — Add-on: portal pages, widget instances and widget copies.
#   full               — Broadest packaged surface, including bundled manage_* flows.
#
# Specialised packages (asset_manager, itsm_developer) hold only what that job needs; their domain
# knowledge lives in config/<package>.rules.md and in skills, not in tools. Add-ons
# are general-purpose and combine with any package.
# Write-capable packages use _extends: standard to avoid duplication. asset_manager and
# its add-ons do not: standard's portal and source-analysis tools would be paid for
# on every request by a session that never calls them.
# MCP_TOOL_PACKAGE takes a comma-separated list, so add-ons cost nothing unless asked for.
# Some registered tools are intentionally left unpackaged; see docs/TOOL_INVENTORY.md.

none: []

# --- Core: minimal read-only essentials ---
# Must stay a strict subset of standard. Tools removed from standard
# (manage_catalog, get_portal) are removed here too.
core:
  - sn_health
  - sn_query
  - sn_aggregate
  - sn_schema
  - sn_discover
  - sn_resolve_url
  - manage_workflow:
      actions: [list, get_activities]
  - manage_flow_designer:
      actions: [list]
  - get_page
  - get_logs
  - search_server_code
  - manage_script_include:
      actions: [list, get]

# --- Safe Mode: Read-only across all domains ---
# manage_* tools listed here use an explicit `actions` allowlist so write
# actions are hidden from the LLM in this profile. Higher profiles re-list
# them as plain strings to expose the full action surface.
# Tools that aren't here (manage_incident / manage_change / etc.) stay out
# of standard entirely — read access for those domains uses generic sn_query.
standard:
  # Core
  - sn_health
  - sn_query
  - sn_aggregate
  - sn_schema
  - sn_discover
  - sn_resolve_url
  # Workflow (Read) — narrow to actually-used actions
  - manage_workflow:
      actions: [list, get_activities]
  # Flow Designer (Read) — unified tool; it has no write actions any more
  - manage_flow_designer:
      actions: [list, get_detail, get_executions, get_action_source]
  # Portal (Read)
  - get_page
  - get_widget_bundle
  - get_portal_component_code
  - get_widget_instance
  - download_portal_sources
  - search_portal_regex_matches
  - trace_portal_route_targets
  - analyze_widget_performance
  # Widget dependency/provider graph (read) — write actions exposed in
  # portal_developer/full. Absorbed get_provider_dependency_map +
  # resolve_widget_chain + resolve_page_dependencies (now internal resolvers).
  - manage_widget_dependency:
      actions: [list, get]
  # Script Include (Read)
  - manage_script_include:
      actions: [list, get]
  # Scripted REST (Read) — write actions exposed in portal_developer/full
  - manage_scripted_rest:
      actions: [list, get]
  # Developer Productivity (Read)
  - get_developer_changes
  # Logs
  - get_logs
  # Search & Analysis
  - search_server_code
  - get_metadata_source
  - extract_table_dependencies
  - download_app_sources
  - audit_local_sources
  # Offline analysis — answer uses/used_by/page/impact from audit graphs, 0 API
  - query_local_graph
  # Attachments (Read) — download a record's attachment file(s) to local disk
  - download_attachment
  # XML export (Read) — importable <unload> XML to disk (current sys_update_version)
  - export_record_xml
  # Deploy XML verification (Read) — origin cert + live compare, both directions.
  # Read-only, so it belongs in standard: the whole point is that nobody has to
  # opt into a higher package to find out an import reverted someone's work.
  - verify_deployment_xml
  # Local Sync (Read)
  - diff_local_component

# --- Portal Developer: portal + flow designer + custom app writes ---
portal_developer:
  _extends: standard
  _tools:
    # Bundled CRUD
    - manage_changeset
    - manage_session_context
    - manage_script_include
    - manage_business_rule
    - manage_portal_layout
    - manage_portal_component
    - manage_widget_dependency
    # Legacy Workflow engine: reads only here (writes in platform_developer/full)
    - manage_workflow:
        actions: [list, get, list_versions, get_activities, export, verify]
    - manage_catalog
    - manage_ui_policy
    # UX Workspace list config CRUD (sys_ux_list — view/columns/fixed_query)
    - manage_ux_list
    # Notification, template, mail script, email layout CRUD (sysevent_email_action/_template, sys_script_email, sys_email_layout)
    - manage_notification
    # Scripted REST API CRUD (sys_ws_definition/sys_ws_operation)
    - manage_scripted_rest
    # Outbound REST message + scheduled job schedule (no other write path)
    - manage_rest_message
    - manage_scheduled_job
    # Portal debugging (specialized read — used by portal analysis/audit skills)
    - detect_angular_implicit_globals
    # Shared debug window — a visible browser the user and the LLM look at
    # together. open_* is the only tool that can put a window on the screen;
    # inspect_* reads whatever is already open and never launches one;
    # act_* drives it (a write — a click on Save creates a record).
    - open_debug_window
    - inspect_debug_window
    - act_in_debug_window
    # Excel without boilerplate (read trackers, write styled sheets, fill
    # forms w/ screenshots) — the sign-off-document legwork, generic
    - manage_workbook
    # Portal writes
    - route_portal_component_edit
    - analyze_portal_component_update
    - preview_portal_component_update
    # Portal CRUD (Page/Layout)
    - scaffold_page
    # Portal config + its whole theme (variables, includes, header/footer)
    - get_portal
    # Flow Designer (Read) — unified tool; it has no write actions any more
    - manage_flow_designer
    # Local Sync writes
    - update_remote_from_local

# --- Platform Developer: standard + workflow/incident/change/script writes ---
platform_developer:
  _extends: standard
  _tools:
    # Flow Designer (Read) — unified tool; it has no write actions any more
    - manage_flow_designer
    # UI Policy writes
    # Portal CRUD
    - scaffold_page
    # Bundled (Phase 2 + 3)
    - manage_incident
    - manage_change
    - manage_workflow
    - manage_script_include
    - manage_business_rule
    - manage_rest_message
    - manage_scheduled_job
    - manage_changeset
    - manage_session_context
    - manage_ui_policy
    - manage_dictionary
    - manage_form_layout
    - manage_list_layout
    - manage_portal_layout
    - manage_portal_component
    # Incident writes — manage_incident covers create/update/comment/resolve
    # Local Sync writes
    - update_remote_from_local
    # Domain-targeted source dumps (rare, kept for explicit upgrade)
    - download_server_sources
    - download_table_schema

# --- Service Desk: standard + incident writes ---
service_desk:
  _extends: standard
  _tools:
    # Bundled (Phase 2 — manage_incident covers create/update/comment/resolve)
    - manage_incident
    # One number → links, approvals, RITM variables, SLA, flow runs (read-only)
    - get_record_context
    # Catalog browsing is part of service desk surface
    - manage_catalog:
        actions: [list_items, get_item, list_categories, list_item_variables]

# --- ITSM developer: Incident, Problem, Change, Request on OOTB tables ---
# Standalone on purpose: one profile must be enough to do the job through an LLM
# (diagnose a record, map what runs on a table, configure catalog items, policies,
# notifications and rules, test approvals and orders, ship by update set / XML).
# It does not _extends standard: the portal and source-analysis surface there
# would be paid for on every request. Domain knowledge: config/itsm_developer.rules.md.
itsm_developer:
  - sn_health
  - sn_query
  - sn_aggregate
  - sn_schema
  - sn_discover
  - sn_resolve_url
  # Diagnose
  - get_record_context
  - get_table_automation
  - get_logs
  - search_server_code
  - get_metadata_source
  - manage_flow_designer:
      actions: [list, get_detail, get_executions, get_action_source]
  - manage_workflow:
      actions: [list, get_activities, export, verify]
  # Design: a portal's whole theme in one read; edit it via download_server_sources
  # families=[theme] → diff_local_component → update_remote_from_local
  - get_portal
  # Process records (test data and fulfilment)
  - manage_incident
  - manage_change
  - manage_problem
  - manage_request_item
  - manage_approval
  # Configuration
  - manage_catalog
  - manage_ui_policy
  - manage_notification
  - manage_business_rule
  - manage_script_include
  - manage_group
  # Assignment/approval rules and field choices — configuration, no scripts
  - manage_task_rule
  - manage_choice
  # Table columns + labels (sys_dictionary / sys_documentation); no type change or delete
  - manage_dictionary
  # Form layout: sections and field placement (sys_ui_section / sys_ui_element)
  - manage_form_layout
  # List columns (sys_ui_list / sys_ui_list_element)
  - manage_list_layout
  # Ship: update sets, deploy XML, edit sources on disk
  - manage_session_context
  - manage_changeset
  - export_record_xml
  - verify_deployment_xml
  - download_server_sources
  - diff_local_component
  - update_remote_from_local

# --- HAM + ITOM: materials and asset management, CMDB, discovery, events ---
# Deliberately almost nothing. Assets, stockrooms, transfer orders, CIs and discovery
# runs are all plain tables, so reading them is sn_query and sn_aggregate; the one
# write tool is manage_asset, which checks every value against the instance before
# writing. The domain knowledge is config/asset_manager.rules.md (sent once per
# session) and the asset-itom-map skill (costs nothing until loaded). Everything
# else is a general-purpose add-on, combined by comma: asset_manager,scripting.
asset_manager:
  - sn_health
  - sn_query
  - sn_aggregate
  - sn_schema
  - sn_discover
  - sn_resolve_url
  - manage_asset

# --- Add-on (general): server-side logic, update sets, and shipping it. ---
scripting:
  - get_logs
  - search_server_code
  - get_metadata_source
  - extract_table_dependencies
  - manage_session_context
  - manage_changeset
  - manage_script_include
  - manage_business_rule
  - manage_scheduled_job
  - manage_rest_message
  - manage_flow_designer:
      actions: [list, get_detail, get_executions, get_action_source]
  - export_record_xml
  - verify_deployment_xml

# --- Add-on (general): Excel workbooks and record attachments. ---
office_files:
  - manage_workbook
  - download_attachment

# --- Add-on (general): bulk data updates in place of a Background Script. ---
# Data tables only (sys_* and sys_metadata children refused). preview is a read and
# runs on read-only instances; apply needs the preview's token + count and leaves
# a snapshot that preview_revert/revert restore from.
data_management:
  - manage_data_update

# --- Add-on (general): the shared debug browser (~1.2k tokens). ---
debug_window:
  - open_debug_window
  - inspect_debug_window
  - act_in_debug_window

# --- Add-on (general): edit server-side sources on disk and push them back. ---
source_sync:
  - download_server_sources
  - diff_local_component
  - update_remote_from_local

# --- Add-on (general): portal design past the theme. ---
# Themes (variables, CSS includes, header/footer bodies) are already reachable from
# get_portal + download_server_sources families=[theme]. This add-on is the next rungs:
# page layout and classes, widget-instance CSS/options, and — last — widget copies.
# Combine for a design phase only: MCP_TOOL_PACKAGE=itsm_developer,portal_design.
portal_design:
  - get_portal
  - get_page
  - get_widget_instance
  - get_widget_bundle
  - download_portal_sources
  - manage_portal_layout
  - manage_portal_component
  - manage_ux_list
  - diff_local_component
  - update_remote_from_local

# --- Full: all tools ---
full:
  _extends: standard
  _tools:
    # Generic write primitive (denylisted sys_* internally)
    - sn_write
    # Bundled CRUD (Phase 2 + 3 — preferred surface)
    - manage_incident
    - manage_change
    - manage_asset
    - manage_kb_article
    - manage_changeset
    - manage_script_include
    - manage_business_rule
    - manage_workflow
    - manage_user
    - manage_group
    - manage_catalog
    - manage_session_context
    - manage_portal_layout
    - manage_portal_component
    - manage_widget_dependency
    - manage_ui_policy
    - manage_scripted_rest
    - manage_ux_list
    - manage_notification
    - manage_rest_message
    - manage_scheduled_job
    # Excel legwork (read trackers, write styled sheets, fill forms). Not a
    # ServiceNow surface at all, but `full` is defined as every manage_*
    # workflow, and it was the one missing from that claim.
    - manage_workbook
    # Bulk data updates (preview → apply with token, snapshot → revert)
    - manage_data_update
    # Flow Designer (Read) — unified tool; it has no write actions any more
    - manage_flow_designer
    # Portal debugging (specialized read — moved out of standard)
    - detect_angular_implicit_globals
    # Portal writes
    - route_portal_component_edit
    - analyze_portal_component_update
    - preview_portal_component_update
    # Portal CRUD
    - scaffold_page
    # UI Policy writes
    # Local Sync writes
    - update_remote_from_local
    # Portal entry (rare; get_page covers most cases)
    - get_portal
    # Domain-targeted source dumps
    - download_server_sources
    - download_table_schema
    # Audit / change reports (rare)
    - audit_pending_changes
    # ITSM: record context, table automation map, process records, approvals
    - get_record_context
    - get_table_automation
    - manage_problem
    - manage_request_item
    - manage_approval
    - manage_task_rule
    - manage_choice
    - manage_dictionary
    - manage_form_layout
    - manage_list_layout
    - get_repo_change_report
