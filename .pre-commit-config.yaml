repos:
  # Black - code formatting
  - repo: local
    hooks:
      - id: black
        name: black
        entry: ./scripts/hook_python.sh -m black
        language: system
        types: [python]

      # Fast structural test gate for skill content changes.
      # --no-cov: the coverage gate in pyproject addopts measures the WHOLE
      # package, so a 76-test file scores ~18% and fails a threshold that has
      # nothing to say about it. That failure blocked pushes while the full suite
      # was green, and the way past it was --no-verify — which also switches off
      # the identity guard. A gate that has to be bypassed is a hole.
      - id: pytest-skills
        name: pytest-skills
        entry: ./scripts/hook_python.sh -m pytest tests/test_skills.py -q --no-cov
        language: system
        pass_filenames: false

      # HARD STOP: real people / accounts / companies must never reach a public
      # push. The rule used to live only in CLAUDE.md as prose, and prose is
      # advisory — three real identifiers got committed anyway. Runs on every
      # commit, not just review.
      - id: no-real-identities
        name: no-real-identities
        entry: ./scripts/hook_python.sh scripts/check_real_identities.py
        language: system
        pass_filenames: false

      # Fast doc/skill orphan tool-name check (Phase 4 deletion gate).
      # Fails if any markdown/yaml references a tool not in the live registry.
      - id: orphan-tool-refs
        name: orphan-tool-refs
        entry: ./scripts/hook_python.sh scripts/check_orphan_tool_refs.py
        language: system
        pass_filenames: false

      # LAST GATE before it leaves the machine. The pre-commit stage above only
      # sees STAGED files and `--no-verify` walks straight past it — so the whole
      # tracked tree is re-scanned here. A push cannot be taken back; a commit can.
      - id: no-real-identities-all
        name: no-real-identities-all
        entry: ./scripts/hook_python.sh scripts/check_real_identities.py --all
        language: system
        pass_filenames: false
        stages: [pre-push]

      # Full test suite before push to avoid CI-only surprises
      - id: pytest-all
        name: pytest-all
        entry: ./scripts/hook_python.sh -m pytest tests/ -q
        language: system
        pass_filenames: false
        stages: [pre-push]

      # The SAME command CI runs, at commit AND push. There used to be a second,
      # commit-only mypy (mirrors-mypy, its own pinned 1.8.0, changed files with
      # --follow-imports=skip), which types every imported symbol as Any — so it
      # could not see an error that depends on another module's signature.
      # v1.22.27 was green locally and failed CI on exactly that, and v1.25.3's
      # commits passed it while the push gate rejected an Optional passed as str.
      # A local gate weaker than the remote one does not fail safe: it reports
      # clean and lets the break through. Whole-tree with the cache is ~1s.
      - id: mypy-all
        name: mypy-all
        entry: ./scripts/hook_python.sh -m mypy src/
        language: system
        pass_filenames: false
        stages: [pre-commit, pre-push]

      # The project's own ruff — the one CI runs. The pinned ruff-pre-commit
      # mirror was v0.1.9 against 0.16.x in CI: fifteen minor versions of rules
      # that could pass here and fail there.
      - id: ruff
        name: ruff
        entry: ./scripts/hook_python.sh -m ruff check --fix --exit-non-zero-on-fix
        language: system
        types: [python]
  # isort - import sorting
  - repo: https://github.com/pycqa/isort
    rev: 8.0.1
    hooks:
      - id: isort
        args: ["--profile", "black"]
